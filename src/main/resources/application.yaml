spring:
  application:
    name: triptrekker
  datasource:
    url: jdbc:postgresql://localhost:5432/flightdb
    username: flightuser
    password: flightpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  config:
    import: optional:classpath:secrets.properties

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 5000
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8088

logging:
  level:
    com.triptrekker: DEBUG
    org.springframework.modulith: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cache:
  type: redis
  default-ttl: PT1H
  caches:
    flights: PT5M

flight:
  providers:
    duffel:
      base-url: https://api.duffel.com

triptrekker:
  notification:
    email:
      from-email: ${NOTIFICATION_FROM_EMAIL:noreply@triptrekker.com}
      from-name: ${NOTIFICATION_FROM_NAME:TripTrekker}
    sms:
      provider: ${SMS_PROVIDER:log}
      httpsms:
        api-key: ${HTTPSMS_API_KEY:}
        from-number: ${HTTPSMS_FROM_NUMBER:}
        base-url: https://api.httpsms.com
